<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" ry="48" fill="url(#bg)"/>

  <!-- Mortarboard cap (graduation hat) -->
  <!-- Hat brim diamond -->
  <polygon points="128,52  200,88  128,124  56,88" fill="white" opacity="0.95"/>
  <!-- Hat top surface highlight -->
  <polygon points="128,52  200,88  128,104  56,88" fill="url(#glow)" opacity="0.3"/>

  <!-- Cap cylinder sides -->
  <rect x="110" y="88" width="36" height="34" rx="4" fill="white" opacity="0.9"/>

  <!-- Tassel string -->
  <line x1="200" y1="88" x2="200" y2="130" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- Tassel bob -->
  <circle cx="200" cy="138" r="9" fill="white" opacity="0.9"/>
  <!-- Tassel fringe lines -->
  <line x1="194" y1="138" x2="190" y2="152" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="200" y1="140" x2="200" y2="155" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="206" y1="138" x2="210" y2="152" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- "G" letterform inside cap -->
  <text x="128" y="118" font-family="'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="28" fill="url(#bg)" text-anchor="middle" dominant-baseline="middle">G</text>

  <!-- Bottom text: "AI" -->
  <text x="128" y="185" font-family="'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="38" fill="white" text-anchor="middle" dominant-baseline="middle" opacity="0.95">AI</text>

  <!-- Decorative bottom underline accent -->
  <rect x="88" y="205" width="80" height="5" rx="2.5" fill="white" opacity="0.5"/>
</svg>
